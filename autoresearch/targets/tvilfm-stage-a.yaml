name: tvilfm-stage-a
repo:
  remote_root: /home/cgv841/ybj
  base_ref: main
  mutable_paths:
    - TVI-LFM/main.py
    - TVI-LFM/core/build.py
    - TVI-LFM/core/train.py
    - TVI-LFM/data_loader/loader.py
    - TVI-LFM/data_loader/sampler.py
    - TVI-LFM/tools/loss.py
    - TVI-LFM/network/model.py
    - TVI-LFM/network/pmt_vit.py
    - TVI-LFM/network/pmt_vit_adapter.py
    - TVI-LFM/network/gem_pool.py
    - TVI-LFM/config/stage_a/*.yaml
  readonly_paths:
    - non_research/**
    - scripts/remote/**
run:
  cwd: TVI-LFM
  command:
    - "{python_bin}"
    - "main.py"
    - "--config_select"
    - "{prepared_config_path}"
  budget_minutes:
    short: 5
    medium: 30
    long: 240
  metric:
    parser: tvilfm_reid
    path: metrics.json
    primary_key: primary_metric
    direction: higher
artifacts:
  collect:
    - metrics.json
    - summary.json
    - config_used.yaml
    - logs
training:
  python_bin: /home/cgv841/anaconda3/envs/clipreid/bin/python
  config_path: /home/cgv841/ybj/TVI-LFM/config/stage_a/pmt_vit_stage_a_current_best.yaml
  data_root: /home/cgv841/datasets/SYSU-MM01
  pretrained: /home/cgv841/ybj/PMT-SYSU/pretrained/jx_vit_base_p16_224-80ecf9dd.pth
gpu:
  policy: lease
  selector: auto
  max_wait_seconds: 900
